name: Python Benchmarks

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        type: string
        default: "3.13"
      working-directory:
        description: "Directory to run steps in"
        type: string
        default: "."
      uv-extras:
        description: "uv extras to install (e.g. dev)"
        type: string
        default: "dev"
      uv-groups:
        description: "uv dependency-groups (PEP 735) to install (e.g. dev)"
        type: string
        default: ""
      bench-dir:
        description: "Directory containing benchmarks"
        type: string
        default: "benchmarks/"
      timeout-minutes:
        description: "Job timeout in minutes"
        type: number
        default: 60
      run_on_draft:
        description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
        required: false
        type: boolean
        default: false
      runner:
        description: |
          JSON-encoded runner label(s). Default: GitHub-hosted ubuntu-latest.
        required: false
        type: string
        default: '["ubuntu-latest"]'

    secrets:
      PRIVATE_DEPS_TOKEN:
        description: "PAT for uv's own clone of private git-source deps in pyproject.toml (optional; falls back to unauthenticated clone, public deps only; not covered by actions/checkout's credential)."
        required: false

jobs:
  bench:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: pytest-benchmark
    permissions:
      contents: read
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true

      - name: Configure git for private git-source deps
        # Placement matters: this step must run AFTER "Set up uv" and BEFORE
        # the uv sync step (this workflow has no "Checkout sibling repos"
        # step). uv resolves git-source dependencies declared in
        # pyproject.toml (e.g. `dep = { git = "https://github.com/..." }`)
        # via its own internal git clone, which does not inherit the
        # per-repo credential actions/checkout writes — that clone happens
        # outside any checked-out repo, so uv is otherwise unauthenticated.
        # No-ops when PRIVATE_DEPS_TOKEN is unset.
        env:
          PRIVATE_DEPS_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${PRIVATE_DEPS_TOKEN:-}" ]]; then
            # url.*.insteadOf is multi-valued and $HOME persists between jobs on
            # non-ephemeral self-hosted runners, so a rewrite installed by an
            # earlier job is matched first and sends the wrong token (a clean
            # 403, not a missing-credential error). Clear any existing
            # github.com rewrite before installing ours.
            git config --global --get-regexp '^url\..*\.insteadOf$' 2>/dev/null \
              | awk '$2 == "https://github.com/" { print $1 }' \
              | while read -r key; do git config --global --unset-all "$key" || true; done
            git config --global --replace-all \
              url."https://x-access-token:${PRIVATE_DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Assert uv.lock exists
        run: |
          set -euo pipefail
          test -s uv.lock || (echo "uv.lock missing — run uv lock"; exit 1)

      - name: Install deps (frozen)
        env:
          UV_EXTRAS: ${{ inputs.uv-extras }}
          UV_GROUPS: ${{ inputs.uv-groups }}
        run: |
          set -euo pipefail
          # Build per-extra/per-group flags from space-separated inputs so
          # "dev api grpc" becomes `--extra dev --extra api --extra grpc` (and
          # similarly for --group). Passing the whole string as one value
          # made uv reject it as invalid. Supports both legacy
          # [project.optional-dependencies] (extras) and PEP 735
          # [dependency-groups] (groups).
          extra_args=()
          for e in $UV_EXTRAS; do
            extra_args+=(--extra "$e")
          done
          for g in $UV_GROUPS; do
            extra_args+=(--group "$g")
          done
          uv sync --frozen "${extra_args[@]}"

      - name: Run benchmarks
        env:
          BENCH_DIR: ${{ inputs.bench-dir }}
        run: |
          set -euo pipefail
          # scan-fix(sonar:S8541): --no-build → --no-sync — --no-build refuses
          # to build the project's own editable distribution ("<pkg> @
          # editable+."), crashing every caller with a path-source/editable
          # local project ("marked as --no-build but has no binary
          # distribution" — see python-mutation.yml / PR #89 for the full
          # repro). The preceding "Install deps (frozen)" step already ran an
          # unrestricted `uv sync --frozen`, so the venv is already built and
          # lock-consistent; --no-sync makes `uv run` use it as-is with zero
          # install/build activity, preserving S8541's no-source-build intent
          # without touching the local project.
          uv run --frozen --no-sync pytest "$BENCH_DIR" \
            --benchmark-only \
            --benchmark-json=benchmark.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-results
          path: ${{ inputs.working-directory == '.' && 'benchmark.json' || format('{0}/benchmark.json', inputs.working-directory) }}
          retention-days: 90
