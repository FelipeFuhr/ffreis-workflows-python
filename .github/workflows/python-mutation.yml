name: Python Mutation Testing

# Reusable workflow — callers invoke via:
#   uses: ./.github/workflows/python-mutation.yml
#
# Intended schedule: weekly (Sunday 02:00 UTC) or workflow_dispatch.
# Do NOT run on every PR — mutation testing takes 5–30 min per repo.
#
# Exit behaviour:
#   - exit 0  → mutation score ≥ threshold   (pass)
#   - exit 1  → mutation score  < threshold  (fail CI)
#
# Requires: mutmut>=2.0 in the uv-extras group (e.g. dev).

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        type: string
        default: "3.13"
      working-directory:
        description: "Directory to run steps in"
        type: string
        default: "."
      uv-extras:
        description: "uv extras group that contains mutmut (e.g. dev)"
        type: string
        default: "dev"
      uv-groups:
        description: "uv dependency groups to install (space-separated, e.g. 'dev docs')"
        type: string
        default: ""
      paths-to-mutate:
        description: "Source path(s) for mutmut to mutate (e.g. src/mypackage)"
        type: string
        default: "src"
      threshold:
        description: "Minimum mutation score (0–100). CI fails if score is below this."
        type: number
        default: 60
      timeout-minutes:
        description: "Total job timeout in minutes"
        type: number
        default: 60
      run_on_draft:
        description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
        required: false
        type: boolean
        default: false
      sibling-repos:
        description: "Space-separated sibling repos to clone before uv sync. Format: 'reponame' (clones to ../reponame) or 'reponame:relative-path' for non-standard paths."
        type: string
        default: ""
      runner:
        description: |
          JSON-encoded runner label(s). Default: GitHub-hosted ubuntu-latest.
        required: false
        type: string
        default: '["ubuntu-latest"]'
    secrets:
      FLEET_READ_TOKEN:
        description: "Fleet-wide read PAT for cloning private sibling repos (optional; falls back to unauthenticated clone)."
        required: false
      PRIVATE_DEPS_TOKEN:
        description: "PAT for uv's own clone of private git-source deps in pyproject.toml (optional; falls back to unauthenticated clone, public deps only; not covered by actions/checkout's credential)."
        required: false
    outputs:
      mutation-score:
        description: "Achieved mutation score (integer, 0–100)"
        value: ${{ jobs.mutation.outputs.score }}

jobs:
  mutation:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Mutation score (mutmut)
    permissions:
      contents: read
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      score: ${{ steps.score.outputs.score }}

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true

      - name: Checkout sibling repos
        if: ${{ inputs.sibling-repos != '' }}
        env:
          SIBLING_REPOS: ${{ inputs.sibling-repos }}
          # scan-fix(org-migration): fleet repos moved FelipeFuhr -> ffreis-org;
          # sibling repos are private, so an unauthenticated clone 404s even
          # with the right org. FLEET_READ_TOKEN is the fleet-wide read PAT
          # (quality-kit/scripts/deploy-pats.sh); callers pass it via
          # `secrets: inherit`. Falls back to an unauthenticated clone (works
          # for public repos) when the secret isn't set.
          FLEET_READ_TOKEN: ${{ secrets.FLEET_READ_TOKEN }}
        run: |
          set -euo pipefail
          for entry in $SIBLING_REPOS; do
            repo="${entry%%:*}"
            if [[ "$entry" == *:* ]]; then
              relpath="${entry#*:}"
              target="$GITHUB_WORKSPACE/$relpath"
            else
              target="$GITHUB_WORKSPACE/../$repo"
            fi
            mkdir -p "$(dirname "$target")"
            # scan-fix(self-hosted-runner): self-hosted pods can reuse a
            # persistent _work directory across jobs of the same workflow run
            # (unlike ephemeral GitHub-hosted runners) — a prior job's sibling
            # clone left `$target` populated, and `git clone` refuses to clone
            # into a non-empty directory. Clear it first for idempotency.
            rm -rf "$target"
            if [[ -n "$FLEET_READ_TOKEN" ]]; then
              clone_url="https://x-access-token:${FLEET_READ_TOKEN}@github.com/ffreis-org/${repo}.git"
            else
              clone_url="https://github.com/ffreis-org/${repo}.git"
            fi
            git clone --depth=1 "$clone_url" "$target"
          done

      - name: Configure git for private git-source deps
        # Placement matters: this step must run AFTER "Checkout sibling
        # repos" and BEFORE the uv sync step. uv resolves git-source
        # dependencies declared in pyproject.toml (e.g. `dep = { git =
        # "https://github.com/..." }`) via its own internal git clone, which
        # does not inherit the per-repo credential actions/checkout writes —
        # that clone happens outside any checked-out repo, so uv is
        # otherwise unauthenticated. Running this step after sibling checkout
        # keeps that step's own unauthenticated public-repo fallback exactly
        # as it is today. No-ops when PRIVATE_DEPS_TOKEN is unset.
        env:
          PRIVATE_DEPS_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${PRIVATE_DEPS_TOKEN:-}" ]]; then
            # url.*.insteadOf is multi-valued and $HOME persists between jobs on
            # non-ephemeral self-hosted runners, so a rewrite installed by an
            # earlier job is matched first and sends the wrong token (a clean
            # 403, not a missing-credential error). Clear any existing
            # github.com rewrite before installing ours.
            git config --global --get-regexp '^url\..*\.insteadOf$' 2>/dev/null \
              | awk '$2 == "https://github.com/" { print $1 }' \
              | while read -r key; do git config --global --unset-all "$key" || true; done
            git config --global --replace-all \
              url."https://x-access-token:${PRIVATE_DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Assert uv.lock exists
        run: |
          set -euo pipefail
          test -s uv.lock || (echo "uv.lock missing — run uv lock"; exit 1)

      - name: Install deps
        env:
          UV_EXTRAS: ${{ inputs.uv-extras }}
          UV_GROUPS: ${{ inputs.uv-groups }}
        run: |
          set -euo pipefail
          # Build per-extra/per-group flags from space-separated inputs so
          # "dev api grpc" becomes `--extra dev --extra api --extra grpc` (and
          # similarly for --group). Passing the whole string as one value
          # made uv reject it as invalid. Supports both legacy
          # [project.optional-dependencies] (extras) and PEP 735
          # [dependency-groups] (groups).
          extra_args=()
          for e in $UV_EXTRAS; do
            extra_args+=(--extra "$e")
          done
          for g in $UV_GROUPS; do
            extra_args+=(--group "$g")
          done
          uv sync --frozen "${extra_args[@]}"

      # Baseline run: verify tests pass before mutating anything.
      - name: Baseline test run
        run: |
          set -euo pipefail
          # scan-fix(sonar:S8541): --no-build → --no-sync — the project itself
          # is always installed editable ("<pkg> @ editable+."), and uv's
          # --no-build refuses to build even that local, first-party editable
          # distribution ("marked as --no-build but has no binary
          # distribution"), crashing every caller with a path-source/editable
          # dependency (reproduced on ffreis-foundry-registry, ffreis-content-
          # mocks). The prior "Install deps" step already ran a full
          # `uv sync --frozen` (no --no-build there), so the venv is already
          # built and consistent with uv.lock; --no-sync tells `uv run` to use
          # that venv as-is with zero install/build activity, which satisfies
          # S8541's intent (no source build, no setup-script execution) more
          # strictly than --no-build did, without touching the local project.
          uv run --frozen --no-sync pytest -q --tb=short 2>&1 | tail -10

      - name: Run mutation testing
        id: run
        env:
          PATHS_TO_MUTATE: ${{ inputs.paths-to-mutate }}
        run: |
          set -euo pipefail
          # scan-fix(sonar:S8541): --no-build → --no-sync — see the Baseline
          # test run step above for the full explanation. mutmut re-invokes
          # pytest against the already-installed editable source on every
          # mutant; --no-sync keeps that fixed rather than re-triggering the
          # same --no-build crash on the first mutant.
          uv run --frozen --no-sync mutmut run \
            --paths-to-mutate "$PATHS_TO_MUTATE" \
            || true   # mutmut exits 1 when mutants survive; score check is below

      - name: Compute score and enforce threshold
        id: score
        env:
          THRESHOLD: ${{ inputs.threshold }}
        run: |
          set -euo pipefail

          python3 - "$THRESHOLD" <<'EOF'
          import os, sqlite3, sys

          threshold = int(sys.argv[1])
          cache = ".mutmut-cache"

          if not os.path.exists(cache):
              print("::notice title=Mutation Score::No .mutmut-cache found — marking as passed.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("score=100\n")
              sys.exit(0)

          conn = sqlite3.connect(cache)
          rows = dict(conn.execute(
              "SELECT status, COUNT(*) FROM mutant GROUP BY status"
          ).fetchall())
          conn.close()

          killed   = rows.get("ok_killed",    0)
          survived = rows.get("bad_survived", 0)
          timeout  = rows.get("bad_timeout",  0)

          total = killed + survived + timeout

          if total == 0:
              print("::notice title=Mutation Score::No viable mutants found — marking as passed.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("score=100\n")
              sys.exit(0)

          score = killed * 100 // total
          print(f"Killed: {killed}  Survived: {survived}  Timeout: {timeout}  Total: {total}")
          print(f"Score: {score}%  Threshold: {threshold}%")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"score={score}\n")

          if score < threshold:
              print(
                  f"::error title=Mutation Score Too Low::"
                  f"Score {score}% is below threshold {threshold}%. "
                  f"Killed {killed}/{total} mutants. "
                  f"Add tests that exercise more code paths."
              )
              sys.exit(1)
          else:
              print(
                  f"::notice title=Mutation Score OK::"
                  f"Score {score}% ≥ threshold {threshold}% ({killed}/{total} mutants killed)."
              )
          EOF

      - name: Upload mutmut cache
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutmut-report
          path: ${{ inputs.working-directory }}/.mutmut-cache
          retention-days: 14
          if-no-files-found: ignore
