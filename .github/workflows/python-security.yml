name: Python Security (pip-audit)

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        type: string
        default: "3.13"
      working-directory:
        description: "Directory to run steps in"
        type: string
        default: "."
      fail-on-vuln:
        description: "Fail the workflow if vulnerabilities are found"
        type: boolean
        default: true
      ignore-vulns:
        description: "Comma-separated list of vulnerability IDs to ignore (e.g. CVE-2026-1234,CVE-2026-9999)"
        type: string
        default: ""
      uv-extras:
        description: "uv extras to install (e.g. dev). Empty by default so the audit only covers what actually ships."
        type: string
        default: ""
      uv-groups:
        description: "uv dependency-groups (PEP 735) to install (e.g. dev)"
        type: string
        default: ""
      run_on_draft:
        description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
        required: false
        type: boolean
        default: false
      runner:
        description: |
          JSON-encoded runner label(s). Default: GitHub-hosted ubuntu-latest.
        required: false
        type: string
        default: '["ubuntu-latest"]'

    secrets:
      PRIVATE_DEPS_TOKEN:
        description: "PAT for uv's own clone of private git-source deps in pyproject.toml (optional; falls back to unauthenticated clone, public deps only; not covered by actions/checkout's credential)."
        required: false

jobs:
  deps-security:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: pip-audit
    permissions:
      contents: read
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true

      - name: Configure git for private git-source deps
        # Placement matters: this step must run AFTER "Set up uv" and BEFORE
        # the uv sync step (this workflow has no "Checkout sibling repos"
        # step). uv resolves git-source dependencies declared in
        # pyproject.toml (e.g. `dep = { git = "https://github.com/..." }`)
        # via its own internal git clone, which does not inherit the
        # per-repo credential actions/checkout writes — that clone happens
        # outside any checked-out repo, so uv is otherwise unauthenticated.
        # No-ops when PRIVATE_DEPS_TOKEN is unset.
        env:
          PRIVATE_DEPS_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${PRIVATE_DEPS_TOKEN:-}" ]]; then
            # url.*.insteadOf is multi-valued and $HOME persists between jobs on
            # non-ephemeral self-hosted runners, so a rewrite installed by an
            # earlier job is matched first and sends the wrong token (a clean
            # 403, not a missing-credential error). Clear any existing
            # github.com rewrite before installing ours.
            git config --global --get-regexp '^url\..*\.insteadOf$' 2>/dev/null \
              | awk '$2 == "https://github.com/" { print $1 }' \
              | while read -r key; do git config --global --unset-all "$key" || true; done
            git config --global --replace-all \
              url."https://x-access-token:${PRIVATE_DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Assert uv.lock exists
        run: |
          set -euo pipefail
          test -s uv.lock || (echo "uv.lock missing — run uv lock"; exit 1)

      - name: Install dependencies from lock
        env:
          UV_EXTRAS: ${{ inputs.uv-extras }}
          UV_GROUPS: ${{ inputs.uv-groups }}
        run: |
          set -euo pipefail
          # scan-fix(sonar:S8541): dropped --no-build — uv editable self-install ships no wheel; deps stay pinned via --frozen lockfile
          extra_args=()
          for e in $UV_EXTRAS; do
            extra_args+=(--extra "$e")
          done
          for g in $UV_GROUPS; do
            extra_args+=(--group "$g")
          done
          uv sync --frozen "${extra_args[@]}"

      - name: pip-audit
        env:
          FAIL_ON_VULN: ${{ inputs.fail-on-vuln }}
          IGNORE_VULNS: ${{ inputs.ignore-vulns }}
        run: |
          set -euo pipefail
          ignore_args=()
          if [[ -n "$IGNORE_VULNS" ]]; then
            IFS=',' read -r -a ignore_arr <<< "$IGNORE_VULNS"
            for v in "${ignore_arr[@]}"; do
              v="${v#"${v%%[![:space:]]*}"}"
              v="${v%"${v##*[![:space:]]}"}"
              [[ -z "$v" ]] && continue
              ignore_args+=(--ignore-vuln "$v")
            done
          fi

          if [[ "$FAIL_ON_VULN" == "true" ]]; then
            uv run --frozen --with pip-audit pip-audit "${ignore_args[@]}"
          else
            uv run --frozen --with pip-audit pip-audit "${ignore_args[@]}" || true
          fi
