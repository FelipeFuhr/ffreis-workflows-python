name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

# Validates that every workflow defined in this library functions correctly
# against the minimal example app in examples/hello/.
#
# python-sonar requires SONAR_TOKEN to be configured in the repository. The
# job is skipped on fork pull requests (secrets are not available to forks),
# but runs on all other events and fails if the token is absent.


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-local-coverage:
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-ci-local-coverage.yml@12c41714d56ff512e8093cd96a2ab11e60aced17
    with:
      mode: defines
      enforce: true

  workflows-policy:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-workflows-policy.yml@3858e9e74c805067e454740b195372c7195f333b # v1.5.0
  codeql-actions:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-codeql.yml@3858e9e74c805067e454740b195372c7195f333b # v1.5.0
    with:
      languages: actions
      source-root: .
      upload-sarif: false

  unit-tests:
    # scan-fix(owner-qualify,lock-diagnostics): covers the embedded shell
    # logic in the "Checkout sibling repos" and "Assert uv.lock is not
    # stale" steps directly (bats, git/uv mocked — no network) rather than
    # only smoke-testing them indirectly through the reusable-workflow calls
    # below, which never set `sibling-repos:` and so never exercise this
    # code path against examples/hello.
    # scan-fix(draft-gate): this job is inline steps, not a `uses:` call to a
    # fleet reusable workflow, so it doesn't inherit that workflow's own
    # run_on_draft gate — gate it explicitly per the draft-first CI convention.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Workflow script unit tests (bats)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install bats + PyYAML
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bats python3-yaml

      - name: Run workflow script unit tests
        run: bats scripts/tests/

  fmt:
    permissions:
      contents: read
    uses: ./.github/workflows/python-fmt.yml
    with:
      working-directory: examples/hello
      # scan-fix(runner-default): this repo is PUBLIC — self-hosted runners
      # (org-scoped to ffreis-org) can never pick up jobs here, so they'd
      # queue forever. Override the fleet-wide self-hosted default back to
      # ubuntu-latest for this repo's own internal CI.
      runner: '["ubuntu-latest"]'

  lint:
    permissions:
      contents: read
    uses: ./.github/workflows/python-lint.yml
    with:
      working-directory: examples/hello
      # scan-fix(runner-default): public repo — self-hosted structurally
      # unavailable here; see the `fmt` job above for the full rationale.
      runner: '["ubuntu-latest"]'

  test:
    permissions:
      contents: read
    uses: ./.github/workflows/python-test.yml
    with:
      working-directory: examples/hello
      # scan-fix(runner-default): public repo — self-hosted structurally
      # unavailable here; see the `fmt` job above for the full rationale.
      runner: '["ubuntu-latest"]'

  build:
    permissions:
      contents: read
    uses: ./.github/workflows/python-build.yml
    with:
      working-directory: examples/hello
      # scan-fix(runner-default): public repo — self-hosted structurally
      # unavailable here. python-build.yml is matrix-based and takes
      # `os-list`, not `runner`; same rationale as the `fmt` job above.
      os-list: '["ubuntu-latest"]'

  lock-sync:
    permissions:
      contents: read
    uses: ./.github/workflows/python-lock-sync.yml
    with:
      working-directory: examples/hello
      # scan-fix(runner-default): public repo — self-hosted structurally
      # unavailable here; see the `fmt` job above for the full rationale.
      runner: '["ubuntu-latest"]'

  security:
    permissions:
      contents: read
    uses: ./.github/workflows/python-security.yml
    with:
      working-directory: examples/hello
      fail-on-vuln: false
      uv-extras: "dev"
      # scan-fix(runner-default): public repo — self-hosted structurally
      # unavailable here; see the `fmt` job above for the full rationale.
      runner: '["ubuntu-latest"]'

  semgrep:
    permissions:
      contents: read
    uses: ./.github/workflows/python-semgrep.yml
    with:
      working-directory: examples/hello
      # scan-fix(runner-default): public repo — self-hosted structurally
      # unavailable here; see the `fmt` job above for the full rationale.
      runner: '["ubuntu-latest"]'

  hypothesis:
    permissions:
      contents: read
    uses: ./.github/workflows/python-hypothesis.yml
    with:
      working-directory: examples/hello
      test-dir: tests/hypothesis_tests
      # scan-fix(runner-default): public repo — self-hosted structurally
      # unavailable here; see the `fmt` job above for the full rationale.
      runner: '["ubuntu-latest"]'

  coverage:
    permissions:
      contents: read
    uses: ./.github/workflows/python-coverage.yml
    with:
      working-directory: examples/hello
      # scan-fix(runner-default): public repo — self-hosted structurally
      # unavailable here; see the `fmt` job above for the full rationale.
      runner: '["ubuntu-latest"]'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  sonar:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    permissions:
      contents: read
    uses: ./.github/workflows/python-sonar.yml
    with:
      working-directory: examples/hello
      # scan-fix(runner-default): public repo — self-hosted structurally
      # unavailable here; see the `fmt` job above for the full rationale.
      runner: '["ubuntu-latest"]'
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docs:
    permissions:
      contents: read
    uses: ./.github/workflows/python-docs.yml
    with:
      working-directory: examples/hello
      # scan-fix(runner-default): public repo — self-hosted structurally
      # unavailable here; see the `fmt` job above for the full rationale.
      runner: '["ubuntu-latest"]'

  bench:
    permissions:
      contents: read
    uses: ./.github/workflows/python-bench.yml
    with:
      working-directory: examples/hello
      # scan-fix(runner-default): public repo — self-hosted structurally
      # unavailable here; see the `fmt` job above for the full rationale.
      runner: '["ubuntu-latest"]'

  mutation:
    permissions:
      contents: read
    uses: ./.github/workflows/python-mutation.yml
    with:
      working-directory: examples/hello
      paths-to-mutate: src
      threshold: 60
      # scan-fix(runner-default): public repo — self-hosted structurally
      # unavailable here; see the `fmt` job above for the full rationale.
      runner: '["ubuntu-latest"]'

  container:
    permissions:
      contents: read
    uses: ./.github/workflows/python-container.yml
    with:
      image-name: hello-example
      context: examples/hello
      containerfile: examples/hello/Containerfile
