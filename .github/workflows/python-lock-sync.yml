name: Python Lock Sync Check

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        type: string
        default: "3.13"
      working-directory:
        description: "Directory to run steps in"
        type: string
        default: "."
      run_on_draft:
        description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
        required: false
        type: boolean
        default: false
      sibling-repos:
        description: "Space-separated sibling repos to clone before uv sync. Format: '[owner/]reponame[:relative-path]' — owner defaults to ffreis-org when omitted; path defaults to ../reponame when omitted."
        type: string
        default: ""
      runner:
        description: |
          JSON-encoded runner label(s). Default: self-hosted [self-hosted, local]. Pass '["ubuntu-latest"]' for GitHub-hosted.
        required: false
        type: string
        default: '["self-hosted","local"]'

    secrets:
      FLEET_READ_TOKEN:
        description: "Fleet-wide read PAT for cloning private sibling repos (optional; falls back to unauthenticated clone)."
        required: false
      PRIVATE_DEPS_TOKEN:
        description: "PAT for uv's own clone of private git-source deps in pyproject.toml (optional; falls back to unauthenticated clone, public deps only; not covered by actions/checkout's credential)."
        required: false

jobs:
  lock-sync:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: uv lock --check
    permissions:
      contents: read
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true

      - name: Checkout sibling repos
        if: ${{ inputs.sibling-repos != '' }}
        env:
          SIBLING_REPOS: ${{ inputs.sibling-repos }}
          # scan-fix(org-migration): fleet repos moved FelipeFuhr -> ffreis-org;
          # sibling repos are private, so an unauthenticated clone 404s even
          # with the right org. FLEET_READ_TOKEN is the fleet-wide read PAT
          # (quality-kit/scripts/deploy-pats.sh); callers pass it via
          # `secrets: inherit`. Falls back to an unauthenticated clone (works
          # for public repos) when the secret isn't set.
          FLEET_READ_TOKEN: ${{ secrets.FLEET_READ_TOKEN }}
        run: |
          set -euo pipefail
          for entry in $SIBLING_REPOS; do
            # scan-fix(owner-qualify): peel off the optional ':relative-path'
            # suffix FIRST, then look for '/' in what remains to split an
            # optional 'owner/repo' prefix. Reversing this order would
            # corrupt entries whose path itself contains '/', e.g.
            # "ffreis-stock-simulator:../../stock/ffreis-stock-simulator".
            repo_spec="${entry%%:*}"
            if [[ "$entry" == *:* ]]; then
              relpath="${entry#*:}"
            else
              relpath=""
            fi
            if [[ "$repo_spec" == */* ]]; then
              owner="${repo_spec%%/*}"
              repo="${repo_spec#*/}"
            else
              # scan-fix(owner-qualify): unqualified entries keep the
              # historical ffreis-org default, so every existing
              # sibling-repos: input keeps working unchanged.
              owner="ffreis-org"
              repo="$repo_spec"
            fi
            if [[ -n "$relpath" ]]; then
              target="$GITHUB_WORKSPACE/$relpath"
            else
              # scan-fix(owner-qualify): target dir stays the bare repo name
              # (never owner/repo) so an owner-qualified entry with no
              # explicit path still lands at the conventional ../<repo>
              # sibling location.
              target="$GITHUB_WORKSPACE/../$repo"
            fi
            mkdir -p "$(dirname "$target")"
            # scan-fix(self-hosted-runner): self-hosted pods can reuse a
            # persistent _work directory across jobs of the same workflow run
            # (unlike ephemeral GitHub-hosted runners) — a prior job's sibling
            # clone left `$target` populated, and `git clone` refuses to clone
            # into a non-empty directory. Clear it first for idempotency.
            rm -rf "$target"
            # scan-fix(owner-qualify): credentials do not survive an HTTPS
            # redirect, so the clone URL must carry the resolved owner
            # directly rather than rely on GitHub's cross-owner redirect —
            # that redirect only works today because the two FelipeFuhr-owned
            # siblings are still public; an authenticated clone across a
            # redirect would 403 the moment either goes private.
            if [[ -n "$FLEET_READ_TOKEN" ]]; then
              clone_url="https://x-access-token:${FLEET_READ_TOKEN}@github.com/${owner}/${repo}.git"
            else
              clone_url="https://github.com/${owner}/${repo}.git"
            fi
            git clone --depth=1 "$clone_url" "$target"
          done

      - name: Configure git for private git-source deps
        # Placement: after "Checkout sibling repos", before `uv lock --check`,
        # so that step's unauthenticated public fallback is unchanged.
        # `uv lock --check` still resolves the
        # full dependency graph, so a git-source dep means resolving its pinned
        # ref and fetching metadata over the same authenticated git path
        # `uv sync` uses. url.*.insteadOf is multi-valued and $HOME persists
        # between jobs on non-ephemeral self-hosted runners, so clear any
        # existing github.com rewrite first. No-ops when the secret is unset.
        env:
          PRIVATE_DEPS_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${PRIVATE_DEPS_TOKEN:-}" ]]; then
            { git config --global --get-regexp '^url\..*\.insteadOf$' 2>/dev/null || true; } \
              | awk '$2 == "https://github.com/" { print $1 }' \
              | while read -r key; do git config --global --unset-all "$key" || true; done
            git config --global --replace-all \
              url."https://x-access-token:${PRIVATE_DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Assert uv.lock is not stale
        run: |
          set -euo pipefail
          if uv lock --check; then
            exit 0
          fi
          # scan-fix(lock-diagnostics): `uv lock --check` prints no diff on
          # failure, only a bare non-zero exit — this cost several CI cycles
          # in this workspace, with the only workaround being a throwaway
          # workflow_dispatch job added just to print what changed, then
          # deleted. Regenerate into the same path (the committed file is
          # backed up first), diff the two, print it, then restore the
          # committed lock file so nothing downstream can commit or consume
          # the regenerated one. This adds diagnostics only — the step must
          # still fail exactly as before.
          echo "::error::uv.lock is stale (uv lock --check failed) — see diff below; run 'uv lock' locally and commit the result"
          cp uv.lock uv.lock.committed-backup
          uv lock
          # scan-fix(lock-diagnostics): `diff` exits 1 when inputs differ,
          # which `set -e` would treat as a script failure — capture it
          # explicitly instead of letting it abort before we can print/clean up.
          diff -u uv.lock.committed-backup uv.lock > uv.lock.diagnostic-diff || true
          diff_lines=$(wc -l < uv.lock.diagnostic-diff)
          echo "--- uv.lock diff (committed vs regenerated) ---"
          head -n 200 uv.lock.diagnostic-diff
          if [[ "$diff_lines" -gt 200 ]]; then
            echo "... diff truncated: $diff_lines total lines, showing first 200 ..."
          fi
          # scan-fix(lock-diagnostics): restore the committed file byte-for-
          # byte and drop the scratch copies — this step must leave the
          # working tree exactly as `uv lock --check` alone would have.
          mv uv.lock.committed-backup uv.lock
          rm -f uv.lock.diagnostic-diff
          exit 1
