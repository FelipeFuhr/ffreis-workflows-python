[project]
name = "hello"
version = "0.1.0"
description = "Hello world example for platform workflow self-testing"
readme = "docs/index.md"
requires-python = ">=3.10"

[project.scripts]
hello = "hello.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.8",
    "pytest>=9.0.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "pytest-benchmark>=4.0",
    "ruff>=0.4",
    "pip-audit>=2.7",
    # mutmut 3.x dropped the `--paths-to-mutate` CLI flag this workflow's
    # own invocation relies on (moved to pyproject.toml config instead) and
    # moved its cache location — capped here so this repo's own self-test
    # exercises the real pass/fail path rather than a version-incompatibility
    # crash. The reusable workflow itself still has no upper bound, so any
    # fleet caller resolving mutmut>=3 hits the same crash; see PR follow-up.
    "mutmut>=2.0,<3",
]
docs = [
    "mkdocs-material>=9.0",
]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
python_version = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests/unit_tests"]

[tool.coverage.run]
source = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hello"]
